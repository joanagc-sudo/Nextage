<!DOCTYPE html>
<html lang="en">

</head>

<body>

    <header class="navbar">
        <div class="logo">
            <span>Nextage</span>
        </div>

        <nav>
            <a href="#" class="ativo">Início</a>
            <a href="#">Disciplinas</a>
            <a href="#">Materiais</a>
            <a href="#">Fórum</a>
        </nav>

        <div class="usuario">
            <img src="imagens/usuario.png" alt="">
        </div>
        
    </header>
</body>



    <section class="atalhos">

    <button class="seta">&lt;</button>

    <div class="atalhos1">

        <div class="sociologia">Sociologia
            <img src="imagens/iconSociologia.png" alt="">
        </div>
        <div class="portugues">Português
            <img src="imagens/iconPortugues.png" alt="">
        </div>
        <div class="filosofia">Filosofia
            <img src="imagens/iconFilosofia.png" alt="">
        </div>
        <div class="geografia">Geografia
            <img src="imagens/iconGeografia.png" alt="">
        </div>
        <div class="fisica">Física
            <img src="imagens/iconFisica.png" alt="">
        </div>
        <div class="biologia">Biologia
            <img src="imagens/iconBiologia.png" alt="">
        </div>
        <div class="ingles">Inglês
            <img src="imagens/iconIngles.png" alt="">
        </div>
        <div class="matematica">Matemática
            <img src="imagens/iconMatematica.png" alt="">
        </div>

    </div>

    <button class="seta">&gt;</button>

</section>

   <section class="atalhos2">

    <div class="Questoes">
        <h1>Questões</h1>
        <p>Exercite seu cérebro</p>
    </div>

    <div class="fundoQuestoes">

        <div class="resolverQuestoes">
            <div class="bolaQuestoes">
                 <h2>+</h2>
            </div>
           
            <div>
                <h2>Resolver questões</h2>
                <p>Escolha um tema e comece a <br>responder</p>
            </div>
        </div>

        <div class="divisor"></div>

        <div class="simulado">
            <h2>Simulados</h2>
            <div class="bolaSimulado">
                <div class="icone" id="folha">
                <img src="imagens/folhaSimulado.png" alt="">
                </div>
            </div>
            <p>Você ainda não resolveu nenhum simulado.</p>
            <div class="addSimulado">
                <h2>+</h2>
            </div>
            <span class="novoSimulado">Iniciar novo simulado</span>
        </div>

    </div>

</section>
</div>
